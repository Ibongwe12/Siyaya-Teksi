
name: Build Siyaya Teksi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet==1.0.5

      - name: Build Android APK
        run: flet build apk . --module-name Siyaya_Teksi_finale --project siyaya-teksi --product "Siyaya Teksi" --org za.co.siyayateksi --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: siyaya-teksi-apk
          path: build/apk/*.apk
          if-no-files-found: error
